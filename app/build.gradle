plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Read secrets from local.properties (not committed to source control)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

android {
    namespace 'com.riyas.SpideyAssistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.riyas.SpideyAssistant"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // Inject Groq API key into BuildConfig so it's never hardcoded in source
        buildConfigField "String", "GROK_API_KEY", "\"${localProps.getProperty('GROK_API_KEY', '')}\""
        buildConfigField "String", "GROK_MODEL",   "\"openai/gpt-oss-120b\""
        buildConfigField "String", "GROK_BASE_URL", "\"https://api.groq.com/openai/v1\""
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
        buildConfig true  // Required to expose BuildConfig fields
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.activity:activity-ktx:1.9.1'

    // Chat bubble list
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Grok (xAI) API — HTTP client + JSON parsing
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
}

